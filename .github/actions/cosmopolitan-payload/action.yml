name: Restore or build Cosmopolitan payload
description: Restore an exact-key sidecar payload cache or build and save it on a miss
inputs:
  cache-key:
    description: Exact key from build and packaging inputs
    required: true
runs:
  using: composite
  steps:
    - name: Restore built Cosmopolitan payload
      id: payload-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: cosmo-payload.tar.gz
        key: ${{ inputs.cache-key }}

    - name: Report Cosmopolitan payload cache status
      shell: bash
      run: |
        echo "Exact payload cache hit: ${{ steps.payload-cache.outputs.cache-hit == 'true' }}"

    - name: Install native build tools
      if: steps.payload-cache.outputs.cache-hit != 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ccache cmake ninja-build g++ python3

    - name: Cache sidecar compiler outputs
      if: steps.payload-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ccache
        key: cosmo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('occt/sidecar/CMakeLists.txt', 'occt/sidecar/cpp/**', 'occt/sidecar/cmake/**', 'occt/sidecar/scripts/build.py', 'occt/sidecar/scripts/patch_occt.py') }}
        restore-keys: |
          cosmo-${{ runner.os }}-${{ runner.arch }}-
          cosmo-${{ runner.os }}-

    - name: Build Cosmopolitan sidecar
      if: steps.payload-cache.outputs.cache-hit != 'true'
      shell: bash
      run: python3 occt/sidecar/scripts/build.py cosmo --jobs 2 --work occt/sidecar/build-work

    - name: Prepare Cosmopolitan payload
      if: steps.payload-cache.outputs.cache-hit != 'true'
      shell: bash
      run: python3 occt/sidecar/scripts/package_cosmopolitan_payload.py --work occt/sidecar/build-work --output cosmo-payload.tar.gz

    - name: Cache built Cosmopolitan payload
      if: steps.payload-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: cosmo-payload.tar.gz
        key: ${{ inputs.cache-key }}
