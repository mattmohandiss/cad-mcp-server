name: Restore or build Cosmopolitan payload
description: >
  Resolve the compiled OCCT Cosmopolitan payload in three tiers: exact-key
  Actions cache, published payload release asset, then a full build. A full
  build takes roughly 90 minutes; the first two tiers take seconds.

inputs:
  cache-key:
    required: true
    description: Exact key derived from the sidecar build and packaging inputs
  jobs:
    required: false
    default: ''
    description: Parallel build jobs; defaults to the runner's CPU count
  publish:
    required: false
    default: 'false'
    description: Publish a freshly built payload as a release asset for other branches

runs:
  using: composite
  steps:
    - name: Restore built Cosmopolitan payload
      id: payload-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: cosmo-payload.tar.gz
        key: ${{ inputs.cache-key }}

    # Actions caches are scoped to the branch that created them, so a payload
    # built in a pull request is invisible to main. The release asset is the
    # branch-independent copy: https://github.com/${{ github.repository }}/releases/tag/payload
    - name: Download published payload
      id: payload-asset
      if: steps.payload-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        asset="${{ inputs.cache-key }}.tar.gz"
        gh release download payload --pattern "$asset" --dir . --clobber
        mv "$asset" cosmo-payload.tar.gz

    - name: Cache pinned build inputs
      if: steps.payload-cache.outputs.cache-hit != 'true' && steps.payload-asset.outcome != 'success'
      uses: actions/cache@v6.1.0
      with:
        path: |
          occt/sidecar/build-work/occt-8.0.1-source.tar.gz
          occt/sidecar/build-work/cosmocc-4.0.2.zip
          occt/sidecar/build-work/json.hpp
        key: cosmo-inputs-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Install native build tools
      if: steps.payload-cache.outputs.cache-hit != 'true' && steps.payload-asset.outcome != 'success'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ccache cmake ninja-build g++ python3

    - name: Cache sidecar compiler outputs
      if: steps.payload-cache.outputs.cache-hit != 'true' && steps.payload-asset.outcome != 'success'
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ccache
        key: cosmo-ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}
        restore-keys: |
          cosmo-ccache-${{ runner.os }}-${{ runner.arch }}-
          cosmo-ccache-${{ runner.os }}-

    - name: Build Cosmopolitan sidecar
      if: steps.payload-cache.outputs.cache-hit != 'true' && steps.payload-asset.outcome != 'success'
      shell: bash
      run: |
        jobs="${{ inputs.jobs }}"
        if [ -z "$jobs" ]; then jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"; fi
        echo "Building with --jobs $jobs"
        python3 occt/sidecar/scripts/build.py cosmo --jobs "$jobs" --work occt/sidecar/build-work
        python3 occt/sidecar/scripts/package_cosmopolitan_payload.py --work occt/sidecar/build-work --output cosmo-payload.tar.gz

    - name: Cache built Cosmopolitan payload
      if: steps.payload-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: cosmo-payload.tar.gz
        key: ${{ inputs.cache-key }}

    - name: Publish payload asset
      if: inputs.publish == 'true' && steps.payload-cache.outputs.cache-hit != 'true' && steps.payload-asset.outcome != 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! gh release view payload >/dev/null 2>&1; then
          gh release create payload --prerelease \
            --title "CI payload cache" \
            --notes "Compiled OCCT Cosmopolitan payloads reused by CI across branches. Managed automatically; safe to ignore."
        fi
        gh release upload payload "cosmo-payload.tar.gz#${{ inputs.cache-key }}.tar.gz" --clobber
        echo "Published ${{ inputs.cache-key }}.tar.gz"
