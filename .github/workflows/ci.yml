name: CI

on:
  pull_request:
    branches: [main]

# Auto-cancel superseded runs for the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decide how much of the pipeline a change actually needs. The compiled OCCT
  # payload costs ~90 minutes to build and only changes when its inputs change,
  # so documentation-only and TypeScript-only pull requests skip it entirely.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      kernel: ${{ steps.plan.outputs.kernel }}
      smoke: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'occt/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'vendor/**'
              - 'scripts/patch_occt.py'
              - '.github/actions/cosmopolitan-payload/**'
            runtime:
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'server.json'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              - 'justfile'
              - '.github/workflows/ci.yml'

      - name: Plan kernel and smoke coverage
        id: plan
        env:
          NATIVE: ${{ steps.filter.outputs.native }}
          RUNTIME: ${{ steps.filter.outputs.runtime }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          # Always emit a valid, non-empty matrix: GitHub evaluates the matrix
          # before a job-level `if`, so an empty one is rejected outright.
          three='{"include":[{"name":"Linux x64","runner":"ubuntu-24.04","run":true},{"name":"macOS ARM64","runner":"macos-14","run":true},{"name":"Windows x64","runner":"windows-2022","run":true}]}'
          one='{"include":[{"name":"Linux x64","runner":"ubuntu-24.04","run":true}]}'
          none='{"include":[{"name":"skipped","runner":"ubuntu-24.04","run":false}]}'
          if [ "$NATIVE" = "true" ] || [ "$FULL_LABEL" = "true" ]; then
            echo "matrix=$three" >> "$GITHUB_OUTPUT"
            echo "kernel=true" >> "$GITHUB_OUTPUT"
          elif [ "$RUNTIME" = "true" ]; then
            echo "matrix=$one" >> "$GITHUB_OUTPUT"
            echo "kernel=true" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$none" >> "$GITHUB_OUTPUT"
            echo "kernel=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting, lint, and unit tests
        run: just check

      - name: Validate MCP registry metadata
        uses: studiomeyer-io/mcp-passport@v0.1.0
        with:
          path: .
          fail-on: error

  build-sidecar:
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Publishing the reusable payload asset is limited to branches in this
    # repository; fork pull requests still consume the published asset.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Restore, download, or build Cosmopolitan payload
        uses: ./.github/actions/cosmopolitan-payload
        with:
          cache-key: ${{ runner.os }}-cosmo-payload-v1-${{ hashFiles('occt/**', 'CMakeLists.txt', 'cmake/**', 'vendor/**', 'scripts/patch_occt.py', '.github/actions/cosmopolitan-payload/action.yml', '.github/workflows/ci.yml') }}
          publish: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

      - uses: actions/upload-artifact@v7
        with:
          name: cosmo-payload
          path: cosmo-payload.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-macos-arm-launcher:
    needs: [changes, build-sidecar]
    if: needs.changes.outputs.kernel == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cosmo-payload
          path: payload

      - name: Build Apple Silicon APE launcher
        run: |
          mkdir -p sidecar-payload
          tar -xzf payload/cosmo-payload.tar.gz -C sidecar-payload
          cc -O -o ape-aarch64.macho sidecar-payload/bin/ape-m1.c
          tar -czf ape-macos-arm64.tar.gz -C . ape-aarch64.macho

      - uses: actions/upload-artifact@v7
        with:
          name: ape-macos-arm64
          path: ape-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

  pack-server:
    needs: [changes, build-sidecar, build-macos-arm-launcher]
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: cosmo-payload
          path: payload

      - uses: actions/download-artifact@v8
        with:
          name: ape-macos-arm64
          path: payload

      - name: Build and pack server
        run: |
          npm run build
          bin=dist/src/sidecar/bin
          mkdir -p "$bin"
          mkdir -p sidecar-payload
          tar -xzf payload/cosmo-payload.tar.gz -C sidecar-payload
          cp -a sidecar-payload/bin/. "$bin/"
          tar -xzf payload/ape-macos-arm64.tar.gz -C "$bin"
          rm "$bin/ape-m1.c"
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pack.json','utf8'))[0].filename;fs.copyFileSync(process.env.RUNNER_TEMP+'/'+p,'package.tgz')"

      - uses: actions/upload-artifact@v7
        with:
          name: packed-cad-mcp
          path: package.tgz
          if-no-files-found: error
          retention-days: 1

  # Packaging and runtime changes get one platform; native changes and the
  # `ci:full` label get all three. The release workflow validates the published
  # tarball on every supported target.
  smoke-packaged:
    needs: [changes, pack-server]
    if: needs.pack-server.result == 'success' && needs.changes.outputs.kernel == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.smoke) }}
    name: Packaged runtime (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/download-artifact@v8
        with:
          name: packed-cad-mcp
          path: packed

      - name: Install packed npm artifact
        run: npm install --prefix smoke --no-save --ignore-scripts ./packed/package.tgz @modelcontextprotocol/client@2.3.1

      - name: Launch packaged sidecar and inspect STEP fixture
        run: node scripts/smoke-packed-cli.mjs

  # Fails the PR if a new dep adds a critical-severity vulnerability.
  # Catches typosquatted packages, known-bad transitive deps, etc.
  dependency-review:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
