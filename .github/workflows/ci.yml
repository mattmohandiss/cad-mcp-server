name: CI

on:
  pull_request:
    branches: [main]

# Auto-cancel superseded runs for the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y ccache cmake ninja-build g++ python3

      - name: Cache native sidecar compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: sidecar-${{ runner.os }}-${{ hashFiles('occt/sidecar/**') }}
          restore-keys: sidecar-${{ runner.os }}-

      - name: Check formatting, lint, and native sidecar integration
        run: just ci

      - name: Validate MCP registry metadata
        uses: studiomeyer-io/mcp-passport@v0.1.0
        with:
          path: .
          fail-on: error

  # Fails the PR if a new dep adds a critical-severity vulnerability.
  # Catches typosquatted packages, known-bad transitive deps, etc.
  dependency-review:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
