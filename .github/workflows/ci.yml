name: CI

on:
  pull_request:
    branches: [main]

# Auto-cancel superseded runs for the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting, lint, and unit tests
        run: just check

      - name: Validate MCP registry metadata
        uses: studiomeyer-io/mcp-passport@v0.1.0
        with:
          path: .
          fail-on: error

  build-sidecar:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Restore built Cosmopolitan payload
        id: cosmo-payload-cache
        uses: actions/cache/restore@v4
        with:
          path: cosmo-payload.tar.gz
          key: ${{ runner.os }}-cosmo-payload-v1-${{ hashFiles('occt/**', 'CMakeLists.txt', 'cmake/**', 'vendor/**', 'scripts/patch_occt.py') }}

      - name: Install native build tools
        if: steps.cosmo-payload-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ccache cmake ninja-build g++ python3

      - name: Cache sidecar compiler outputs
        if: steps.cosmo-payload-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: cosmo-${{ runner.os }}-${{ hashFiles('occt/sidecar/**') }}
          restore-keys: cosmo-${{ runner.os }}-

      - name: Build Cosmopolitan sidecar
        if: steps.cosmo-payload-cache.outputs.cache-hit != 'true'
        run: python3 occt/sidecar/scripts/build.py cosmo --jobs 2 --work occt/sidecar/build-work

      - name: Prepare Cosmopolitan payload
        if: steps.cosmo-payload-cache.outputs.cache-hit != 'true'
        run: |
          bin=sidecar-payload/bin
          mkdir -p "$bin"
          cp occt/sidecar/build-work/cosmo/occt-sidecar "$bin/occt-sidecar.exe"
          cp occt/sidecar/build-work/cosmocc/bin/ape-m1.c "$bin/ape-m1.c"
          for launcher in ape-x86_64.elf ape-aarch64.elf ape-x86_64.macho; do
            source=$(find occt/sidecar/build-work/cosmocc -type f -name "$launcher" -print -quit)
            test -n "$source" || { echo "Missing Cosmopolitan launcher: $launcher"; exit 1; }
            cp "$source" "$bin/$launcher"
          done
          tar -czf cosmo-payload.tar.gz -C sidecar-payload .

      - name: Cache built Cosmopolitan payload
        if: steps.cosmo-payload-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cosmo-payload.tar.gz
          key: ${{ steps.cosmo-payload-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: cosmo-payload
          path: cosmo-payload.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-macos-arm-launcher:
    needs: build-sidecar
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cosmo-payload
          path: payload

      - name: Build Apple Silicon APE launcher
        run: |
          mkdir -p sidecar-payload
          tar -xzf payload/cosmo-payload.tar.gz -C sidecar-payload
          cc -O -o ape-aarch64.macho sidecar-payload/bin/ape-m1.c
          tar -czf ape-macos-arm64.tar.gz -C . ape-aarch64.macho

      - uses: actions/upload-artifact@v4
        with:
          name: ape-macos-arm64
          path: ape-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

  pack-server:
    needs: [build-sidecar, build-macos-arm-launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: cosmo-payload
          path: payload

      - uses: actions/download-artifact@v4
        with:
          name: ape-macos-arm64
          path: payload

      - name: Run geometry integration tests on the Cosmopolitan sidecar
        run: |
          mkdir -p sidecar-payload
          tar -xzf payload/cosmo-payload.tar.gz -C sidecar-payload
          launcher="$PWD/sidecar-payload/bin/ape-x86_64.elf"
          test -x "$launcher"
          CAD_MCP_SIDECAR="$PWD/sidecar-payload/bin/occt-sidecar.exe" \
          CAD_MCP_SIDECAR_LAUNCHER="$launcher" \
          CAD_MCP_TEST_STEP="$PWD/src/tests/fixtures/repeated-instances.step" \
          npx vitest run src/tests/sidecar-assembly.integration.test.ts src/tests/sidecar-measure.integration.test.ts

      - name: Build and pack server
        run: |
          npm run build
          bin=dist/src/sidecar/bin
          mkdir -p "$bin"
          cp -a sidecar-payload/bin/. "$bin/"
          tar -xzf payload/ape-macos-arm64.tar.gz -C "$bin"
          rm "$bin/ape-m1.c"
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pack.json','utf8'))[0].filename;fs.copyFileSync(process.env.RUNNER_TEMP+'/'+p,'package.tgz')"

      - uses: actions/upload-artifact@v4
        with:
          name: packed-cad-mcp
          path: package.tgz
          if-no-files-found: error
          retention-days: 1

  platform-smoke:
    needs: pack-server
    name: smoke (${{ matrix.target }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install smoke-test client
        run: npm ci --force

      - uses: actions/download-artifact@v4
        with:
          name: packed-cad-mcp
          path: package

      - name: Install packed server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cad-mcp-smoke"
          cd "$RUNNER_TEMP/cad-mcp-smoke"
          npm init -y > /dev/null 2>&1
          npm install --force "$GITHUB_WORKSPACE/package/package.tgz"

      - name: Test packed MCP inspect call
        shell: bash
        run: node scripts/smoke-packed-cli.mjs "$RUNNER_TEMP/cad-mcp-smoke/node_modules/cad-mcp-server/dist/src/index.js" "$GITHUB_WORKSPACE/src/tests/fixtures/repeated-instances.step"

  # Fails the PR if a new dep adds a critical-severity vulnerability.
  # Catches typosquatted packages, known-bad transitive deps, etc.
  dependency-review:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
