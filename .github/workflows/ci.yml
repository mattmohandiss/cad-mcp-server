name: CI

on:
  pull_request:
    branches: [main]

# Auto-cancel superseded runs for the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install occt-wasm dev dependencies
        run: cd occt/ts && npm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt clippy

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting, lint, and tests
        run: just check

      - name: Validate MCP registry metadata
        uses: studiomeyer-io/mcp-passport@v0.1.0
        with:
          path: .
          fail-on: error

  # Fails the PR if a new dep adds a critical-severity vulnerability.
  # Catches typosquatted packages, known-bad transitive deps, etc.
  dependency-review:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
