name: CI

on:
  pull_request:
    branches: [main]

# Auto-cancel superseded runs for the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting, lint, and unit tests
        run: just check

      - name: Validate MCP registry metadata
        uses: studiomeyer-io/mcp-passport@v0.1.0
        with:
          path: .
          fail-on: error

  build-sidecar:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Restore or build Cosmopolitan payload
        uses: ./.github/actions/cosmopolitan-payload
        with:
          cache-key: ${{ runner.os }}-cosmo-payload-v1-${{ hashFiles('occt/**', 'CMakeLists.txt', 'cmake/**', 'vendor/**', 'scripts/patch_occt.py', '.github/actions/cosmopolitan-payload/action.yml') }}

      - uses: actions/upload-artifact@v7
        with:
          name: cosmo-payload
          path: cosmo-payload.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-macos-arm-launcher:
    needs: build-sidecar
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cosmo-payload
          path: payload

      - name: Build Apple Silicon APE launcher
        run: |
          mkdir -p sidecar-payload
          tar -xzf payload/cosmo-payload.tar.gz -C sidecar-payload
          cc -O -o ape-aarch64.macho sidecar-payload/bin/ape-m1.c
          tar -czf ape-macos-arm64.tar.gz -C . ape-aarch64.macho

      - uses: actions/upload-artifact@v7
        with:
          name: ape-macos-arm64
          path: ape-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

  pack-server:
    needs: [build-sidecar, build-macos-arm-launcher]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: cosmo-payload
          path: payload

      - uses: actions/download-artifact@v8
        with:
          name: ape-macos-arm64
          path: payload

      - name: Build and pack server
        run: |
          npm run build
          bin=dist/src/sidecar/bin
          mkdir -p "$bin"
          mkdir -p sidecar-payload
          tar -xzf payload/cosmo-payload.tar.gz -C sidecar-payload
          cp -a sidecar-payload/bin/. "$bin/"
          tar -xzf payload/ape-macos-arm64.tar.gz -C "$bin"
          rm "$bin/ape-m1.c"
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pack.json','utf8'))[0].filename;fs.copyFileSync(process.env.RUNNER_TEMP+'/'+p,'package.tgz')"

      - uses: actions/upload-artifact@v7
        with:
          name: packed-cad-mcp
          path: package.tgz
          if-no-files-found: error
          retention-days: 1

  # Fails the PR if a new dep adds a critical-severity vulnerability.
  # Catches typosquatted packages, known-bad transitive deps, etc.
  dependency-review:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
