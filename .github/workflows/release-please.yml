name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize main-branch release processing; never cancel an active publish.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  # Seed the reusable payload once per sidecar input change. When the inputs are
  # unchanged this resolves from cache or the published release asset in seconds.
  payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Restore, download, or build Cosmopolitan payload
        uses: ./.github/actions/cosmopolitan-payload
        with:
          cache-key: ${{ runner.os }}-cosmo-payload-v1-${{ hashFiles('occt/**', 'CMakeLists.txt', 'cmake/**', 'vendor/**', 'scripts/patch_occt.py', '.github/actions/cosmopolitan-payload/action.yml', '.github/workflows/ci.yml') }}
          asset-key: ${{ runner.os }}-cosmo-occt-v1-${{ hashFiles('occt/**', 'CMakeLists.txt', 'cmake/**', 'vendor/**', 'scripts/patch_occt.py') }}
          tree-key: ${{ runner.os }}-cosmo-tree-v1-${{ hashFiles('occt/sidecar/CMakeLists.txt', 'occt/sidecar/cmake/**', 'occt/sidecar/scripts/patch_occt.py', 'occt/sidecar/scripts/build.py', 'vendor/**') }}
          publish: 'true'

  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v7

      # Preferred: a GitHub App installation token — short-lived, nothing to
      # rotate, and not subject to PAT org policies. Falls back to
      # RELEASE_PLEASE_TOKEN, then GITHUB_TOKEN, so it is safe to adopt before the
      # App secrets exist.
      - uses: actions/create-github-app-token@v3
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The token must belong to a user or app, never GITHUB_TOKEN: PRs created
      # with GITHUB_TOKEN do not trigger CI, so the release PR could never pass
      # the required `check`.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-sidecar:
    needs: [release-please, payload]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Restore, download, or build Cosmopolitan payload
        uses: ./.github/actions/cosmopolitan-payload
        with:
          cache-key: ${{ runner.os }}-cosmo-payload-v1-${{ hashFiles('occt/**', 'CMakeLists.txt', 'cmake/**', 'vendor/**', 'scripts/patch_occt.py', '.github/actions/cosmopolitan-payload/action.yml', '.github/workflows/ci.yml') }}
          asset-key: ${{ runner.os }}-cosmo-occt-v1-${{ hashFiles('occt/**', 'CMakeLists.txt', 'cmake/**', 'vendor/**', 'scripts/patch_occt.py') }}
          tree-key: ${{ runner.os }}-cosmo-tree-v1-${{ hashFiles('occt/sidecar/CMakeLists.txt', 'occt/sidecar/cmake/**', 'occt/sidecar/scripts/patch_occt.py', 'occt/sidecar/scripts/build.py', 'vendor/**') }}

      - name: Upload release sidecar payload
        uses: actions/upload-artifact@v7
        with:
          name: release-cosmo-payload
          path: cosmo-payload.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-macos-arm-launcher:
    needs: [release-please, build-sidecar]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-cosmo-payload
          path: payload

      - name: Build Apple Silicon APE launcher
        run: |
          mkdir -p sidecar-payload
          tar -xzf payload/cosmo-payload.tar.gz -C sidecar-payload
          cc -O -o ape-aarch64.macho sidecar-payload/bin/ape-m1.c
          tar -czf ape-macos-arm64.tar.gz ape-aarch64.macho

      - uses: actions/upload-artifact@v7
        with:
          name: release-ape-macos-arm64
          path: ape-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Pack the release artifact once, validate that exact tarball on every
  # supported target, then publish the same bytes.
  pack-release:
    needs: [release-please, build-macos-arm-launcher]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: release-cosmo-payload
          path: payload

      - uses: actions/download-artifact@v8
        with:
          name: release-ape-macos-arm64
          path: payload

      - name: Build and pack server
        run: |
          npm run build
          bin=dist/src/sidecar/bin
          mkdir -p "$bin"
          tar -xzf payload/cosmo-payload.tar.gz -C dist/src/sidecar
          tar -xzf payload/ape-macos-arm64.tar.gz -C "$bin"
          rm "$bin/ape-m1.c"
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          TARBALL=$(node -e "const p=require(process.env.RUNNER_TEMP+'/pack.json')[0]; console.log(p.filename)")
          cp "$RUNNER_TEMP/$TARBALL" package.tgz
          cp "$RUNNER_TEMP/pack.json" pack.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: |
            package.tgz
            pack.json
          if-no-files-found: error
          retention-days: 7

  smoke-release:
    needs: pack-release
    if: ${{ needs.pack-release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: macOS ARM64
            runner: macos-14
          - name: Windows x64
            runner: windows-2022
    name: Release smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v8
        with:
          name: release-tarball
          path: packed

      - name: Install packed npm artifact
        run: npm install --prefix smoke --no-save --ignore-scripts ./packed/package.tgz @modelcontextprotocol/client@2.3.1

      - name: Launch packaged sidecar and inspect STEP fixture
        run: node scripts/smoke-packed-cli.mjs

  publish:
    needs: [release-please, smoke-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate MCP registry metadata
        uses: studiomeyer-io/mcp-passport@v0.1.0
        with:
          path: .
          fail-on: error

      - uses: actions/download-artifact@v8
        with:
          name: release-tarball

      - name: Describe the smoke-tested tarball
        run: |
          echo "PACKAGE_TARBALL=$PWD/package.tgz" >> "$GITHUB_ENV"
          INTEGRITY=$(node -e "const p=require('./pack.json')[0]; console.log(p.integrity)")
          echo "PACKAGE_INTEGRITY=$INTEGRITY" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if EXISTING=$(npm view "$NAME@$VERSION" dist.integrity --json 2>/dev/null); then
            EXISTING_INTEGRITY=$(node -e 'console.log(JSON.parse(process.argv[1]))' "$EXISTING")
            if [ "$EXISTING_INTEGRITY" != "$PACKAGE_INTEGRITY" ]; then
              echo "Published $NAME@$VERSION integrity does not match the release tarball" >&2
              exit 1
            fi
            echo "$NAME@$VERSION already published with the tested integrity; skipping npm publish"
          else
            npm publish "$PACKAGE_TARBALL"
          fi

      - name: Install MCP Registry publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsSL -o "$archive" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  '"$archive" | sha256sum --check
          tar xzf "$archive" mcp-publisher

      - name: Publish to MCP Registry
        run: |
          max=5
          for n in $(seq 0 $((max - 1))); do
            if [ "$n" -gt 0 ]; then
              wait=$((2 ** (n - 1) * 15))
              echo "Retry $n/$((max - 1)) in ${wait}s..."
              sleep "$wait"
            fi
            echo "MCP Registry publish attempt $((n + 1))/$max..."
            ./mcp-publisher login github-oidc
            if output=$(./mcp-publisher publish 2>&1); then
              printf '%s\n' "$output"
              echo "MCP Registry publish succeeded"
              exit 0
            else
              status=$?
            fi

            printf '%s\n' "$output"
            if [[ "$output" == *"was not found"* || "$output" == *"server returned status 429"* || "$output" == *"server returned status 5"* ]]; then
              echo "Publish failed with a retryable registry error (exit $status)."
              continue
            fi

            echo "Publish failed with a non-retryable error (exit $status)."
            exit "$status"
          done
          echo "MCP Registry publish failed after $max attempts"
          exit 1
