name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PLEASE_TOKEN is a classic PAT with contents:write and
      # pull_requests:write scopes.  Needed so release-please PRs trigger
      # normal CI (GITHUB_TOKEN cannot trigger downstream workflows by design).
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Once a GitHub Release is created, build the sidecar and publish to npm.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created }}

      - name: Validate MCP registry metadata
        if: ${{ steps.release.outputs.release_created }}
        uses: studiomeyer-io/mcp-passport@v0.1.0
        with:
          path: .
          fail-on: error

      - name: Install native build tools
        if: ${{ steps.release.outputs.release_created }}
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ python3

      - name: Build OCCT sidecar
        if: ${{ steps.release.outputs.release_created }}
        run: python3 occt/sidecar/scripts/build.py cosmo --jobs 2 --work occt/sidecar/build-work

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Build TypeScript
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Package sidecar executable and launchers
        if: ${{ steps.release.outputs.release_created }}
        run: |
          bin=dist/src/sidecar/bin
          mkdir -p "$bin"
          cp occt/sidecar/build-work/cosmo/occt-sidecar "$bin/occt-sidecar.exe"
          for launcher in ape-x86_64.elf ape-aarch64.elf ape-x86_64.macho ape-aarch64.macho; do
            source=$(find occt/sidecar/build-work/cosmocc -type f -name "$launcher" -print -quit)
            test -n "$source" || { echo "Missing Cosmopolitan launcher: $launcher"; exit 1; }
            cp "$source" "$bin/$launcher"
          done

      - name: Run tests
        if: ${{ steps.release.outputs.release_created }}
        run: npm test

      - name: Smoke-test packed CLI
        if: ${{ steps.release.outputs.release_created }}
        run: |
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename));")
          SMOKE_DIR=$(mktemp -d "$RUNNER_TEMP/cad-mcp-smoke.XXXXXX")
          cd "$SMOKE_DIR"
          npm init -y > /dev/null 2>&1
          npm install "$RUNNER_TEMP/$TARBALL"
          node "$GITHUB_WORKSPACE/scripts/smoke-packed-cli.mjs" \
            "$SMOKE_DIR/node_modules/cad-mcp-server/dist/src/index.js" \
            "$GITHUB_WORKSPACE/src/tests/fixtures/repeated-instances.step"

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish

      - name: Install MCP Registry publisher
        if: ${{ steps.release.outputs.release_created }}
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        if: ${{ steps.release.outputs.release_created }}
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: ${{ steps.release.outputs.release_created }}
        run: |
          max=5
          for n in $(seq 0 $((max - 1))); do
            if [ "$n" -gt 0 ]; then
              wait=$((2 ** n * 15))
              echo "Retry $n/$((max - 1)) in ${wait}s..."
              sleep "$wait"
            fi
            echo "MCP Registry publish attempt $((n + 1))/$max..."
            if ./mcp-publisher publish; then
              echo "MCP Registry publish succeeded"
              exit 0
            fi
          done
          echo "MCP Registry publish failed after $max attempts"
          exit 1
